name: CI

# Existing-style checks for the public module bank (grid-terraform).
# Does not replace or remove workflows in other Grid repos.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive
