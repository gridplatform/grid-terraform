name: CI

# Module bank formatting gate. Failures print -diff so the broken files are obvious.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt (check)
        run: |
          set -euo pipefail
          if ! terraform fmt -check -recursive -diff; then
            echo ""
            echo "::error::terraform fmt check failed. Run locally:"
            echo "  cd grid-terraform && terraform fmt -recursive"
            echo "Then commit the reformatted .tf files."
            exit 1
          fi
          echo "terraform fmt -check OK"
