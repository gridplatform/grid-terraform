name: Release

# Publishes a GitHub Release and floating git tags for the module bank.
#   Current: vX.Y.Z → tag `current`
#   LTS:     vX.Y.Z-lts → tags `current` and `lts`
#
# Grid installs pin modules with GRID_MODULE_BANK_REF / Admin “module version”
# (e.g. v0.1.0). Same versioning model as grid-cli.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-lts"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version / channel
        id: meta
        run: |
          RAW="${GITHUB_REF_NAME}"
          VER="${RAW#v}"
          IS_LTS=false
          if [[ "$RAW" == *-lts ]]; then
            VER="${VER%-lts}"
            IS_LTS=true
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "is_lts=${IS_LTS}" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Update channel tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f current "${GITHUB_SHA}"
          git push -f origin refs/tags/current
          if [[ "${{ steps.meta.outputs.is_lts }}" == "true" ]]; then
            git tag -f lts "${GITHUB_SHA}"
            git push -f origin refs/tags/lts
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.is_lts == 'true' && format('v{0} LTS', steps.meta.outputs.version) || format('v{0}', steps.meta.outputs.version) }}
          generate_release_notes: true
          body: |
            Terraform module bank release `${{ github.ref_name }}`.

            Pin in Grid:
            ```bash
            GRID_MODULE_BANK=https://github.com/gridplatform/grid-terraform.git
            GRID_MODULE_BANK_REF=${{ github.ref_name }}
            ```
            Or set **Admin → Sources → Module version** to `${{ github.ref_name }}` / `${{ steps.meta.outputs.version }}`.
