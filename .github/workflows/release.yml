name: Release

# Creates a GitHub Release when a semver tag is pushed (`vX.Y.Z` or `vX.Y.Z-lts`).
# Module pins use that tag via GRID_MODULE_BANK_REF / Admin → Sources.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-lts"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version / channel
        id: meta
        run: |
          RAW="${GITHUB_REF_NAME}"
          VER="${RAW#v}"
          IS_LTS=false
          if [[ "$RAW" == *-lts ]]; then
            VER="${VER%-lts}"
            IS_LTS=true
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "is_lts=${IS_LTS}" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt (check)
        run: |
          set -euo pipefail
          if ! terraform fmt -check -recursive -diff; then
            echo ""
            echo "::error::terraform fmt check failed. Run locally:"
            echo "  cd grid-terraform && terraform fmt -recursive"
            echo "Then commit the reformatted .tf files."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.is_lts == 'true' && format('v{0} LTS', steps.meta.outputs.version) || format('v{0}', steps.meta.outputs.version) }}
          generate_release_notes: true
          body: |
            Terraform module bank release `${{ github.ref_name }}`.

            Pin in Grid:
            ```bash
            GRID_MODULE_BANK=https://github.com/gridplatform/grid-terraform.git
            GRID_MODULE_BANK_REF=${{ github.ref_name }}
            ```
            Or set **Admin → Sources → Module version** to `${{ github.ref_name }}` / `${{ steps.meta.outputs.version }}`.
