name: Release

# Creates a GitHub Release when a semver tag is pushed (`vX.Y.Z` or `vX.Y.Z-lts`).
# Module pins use that tag via GRID_MODULE_BANK_REF / Admin → Sources.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-lts"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse version / channel
        id: meta
        run: |
          RAW="${GITHUB_REF_NAME}"
          VER="${RAW#v}"
          IS_LTS=false
          if [[ "$RAW" == *-lts ]]; then
            VER="${VER%-lts}"
            IS_LTS=true
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "is_lts=${IS_LTS}" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt (check)
        run: |
          set -euo pipefail
          if ! terraform fmt -check -recursive -diff; then
            echo ""
            echo "::error::terraform fmt check failed. Run locally:"
            echo "  cd grid-terraform && terraform fmt -recursive"
            echo "Then commit the reformatted .tf files."
            exit 1
          fi

      - name: Write release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODULE_REF: ${{ github.ref_name }}
          MODULE_VER: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Fresh notes every publish. Updating a release with generated notes
          # appends another Full Changelog line, so the body is replaced below.
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${GITHUB_REF_NAME}" \
            --jq .body > /tmp/generated.md
          python3 - << 'PY'
          import os
          from pathlib import Path
          ref = os.environ["MODULE_REF"]
          ver = os.environ["MODULE_VER"]
          prefix = [
              f"Terraform module bank release `{ref}`.",
              "",
              "Pin in Grid:",
              "```bash",
              "GRID_MODULE_BANK=https://github.com/gridplatform/grid-terraform.git",
              f"GRID_MODULE_BANK_REF={ref}",
              "```",
              f"Or set **Admin → Sources → Module version** to `{ref}` / `{ver}`.",
              "",
          ]
          lines = prefix + Path("/tmp/generated.md").read_text().splitlines()
          body, changelogs = [], []
          for line in lines:
              plain = line.replace("*", "").strip().lower()
              if plain.startswith("full changelog:"):
                  changelogs.append(line.strip())
              else:
                  body.append(line)
          while body and not body[-1].strip():
              body.pop()
          if changelogs:
              body += ["", changelogs[-1]]
          Path("release-notes.md").write_text("\n".join(body).rstrip() + "\n")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.is_lts == 'true' && format('v{0} LTS', steps.meta.outputs.version) || format('v{0}', steps.meta.outputs.version) }}
          body_path: release-notes.md
          append_body: false
